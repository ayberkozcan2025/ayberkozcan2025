<!-- assets/coding.svg -->

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="210"
     viewBox="0 0 320 210" role="img" aria-labelledby="title desc">
  <title id="title">Kod editörü</title>
  <desc id="desc">Kod satırları sırayla belirir ve imleç yanıp söner.</desc>

  <style>
    .panel { fill: #f8fafc; stroke: #e2e8f0; }
    .text { fill: #475569; }
    .line {
      stroke: #94a3b8;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 180;
      animation: write 6s ease-in-out infinite;
    }
    .accent { stroke: #38bdf8; }
    .cursor {
      fill: #64748b;
      animation: blink 1.2s steps(2) infinite;
    }

    @keyframes write {
      0%, 12% { stroke-dashoffset: 180; opacity: 0; }
      35%, 85%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #30363d; }
      .text { fill: #94a3b8; }
    }

    @media (prefers-reduced-motion: reduce) {
      .line, .cursor { animation: none; }
    }
  </style>

  <rect class="panel" x="1" y="1" width="318" height="208" rx="14" />

  <circle cx="20" cy="22" r="4" fill="#94a3b8" />
  <circle cx="34" cy="22" r="4" fill="#cbd5e1" />
  <circle cx="48" cy="22" r="4" fill="#e2e8f0" />

  <text class="text" x="298" y="26" text-anchor="end"
        font-family="monospace" font-size="11">profile.ts</text>

  <text class="text" x="22" y="69"
        font-family="monospace" font-size="13">const developer = {</text>

  <path class="line accent" d="M42 91h72" />
  <path class="line" style="animation-delay:.3s" d="M128 91h136" />
  <path class="line accent" style="animation-delay:.6s" d="M42 115h92" />
  <path class="line" style="animation-delay:.9s" d="M148 115h98" />
  <path class="line accent" style="animation-delay:1.2s" d="M42 139h56" />
  <path class="line" style="animation-delay:1.5s" d="M112 139h152" />

  <text class="text" x="22" y="173"
        font-family="monospace" font-size="13">};</text>
  <rect class="cursor" x="42" y="161" width="7" height="15" />

  <text class="text" x="298" y="191" text-anchor="end"
        font-family="monospace" font-size="10">learn · build · improve</text>
</svg>
